<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Don Bosco Senior Youth">
  <!-- The group's dawn/horizon mark: the sun rising over the line, in the same
       coral-to-gold gradient used by HorizonLine and HorizonScene. -->
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8552" />
      <stop offset="100%" stop-color="#FFD56B" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#16242A" />
  <circle cx="16" cy="18" r="7.5" fill="url(#sun)" />
  <rect x="4" y="21" width="24" height="1.75" rx="0.875" fill="url(#sun)" />
  <circle cx="16" cy="21.875" r="1.9" fill="#FFD56B" />
</svg>
